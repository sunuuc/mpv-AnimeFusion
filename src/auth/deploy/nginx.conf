server {
    listen 80;
    server_name bangumi.sunuuc.de5.net;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://bangumi.sunuuc.de5.net$request_uri; }
}
server {
    listen 443 ssl;
    server_name bangumi.sunuuc.de5.net;
    ssl_certificate /etc/letsencrypt/live/bangumi.sunuuc.de5.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bangumi.sunuuc.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://auth:8080;
        proxy_set_header Host bangumi.sunuuc.de5.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
