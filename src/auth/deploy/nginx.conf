set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name api.sunuuc.de5.net;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://api.sunuuc.de5.net$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.sunuuc.de5.net;
    ssl_certificate /etc/letsencrypt/live/api.sunuuc.de5.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sunuuc.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_set_header Host api.sunuuc.de5.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    location /bangumi/ {
        proxy_pass http://auth:8080;
    }
    location /trakt/ {
        proxy_pass http://trakt-auth:8080;
    }
    location /mal/ {
        proxy_pass http://mal-auth:8080;
    }
    location = / { return 200 "mpv-AnimeFusion authorization\n"; }
    location / { return 404; }
}

server {
    listen 80;
    server_name bangumi.sunuuc.de5.net trakt.sunuuc.de5.net mal.sunuuc.de5.net;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name bangumi.sunuuc.de5.net trakt.sunuuc.de5.net mal.sunuuc.de5.net;
    ssl_certificate /etc/letsencrypt/live/api.sunuuc.de5.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sunuuc.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 8k;
    charset utf-8;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 410; }
    location / {
        root /usr/share/nginx/html;
        try_files /update.html =404;
    }
}
