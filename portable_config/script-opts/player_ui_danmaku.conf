# 弹幕。这个文件由 player_ui_danmaku.lua 读取（不是 player_ui.conf）。
#
# 线路可在播放器的「设置 → 弹幕设置 → 配置弹幕线路」中维护，并保存在当前用户的本机配置目录。
# 发布包中的这个选项始终留空；用户线路不会写进 portable_config 或发布文件。

# ── 线路 ────────────────────────────────────────────────────────────────────
# api_servers：发布默认保持空；运行时只从当前用户的私有配置读取线路。
#   英文逗号分隔，**有序**（前面的优先）。
#   每项可用 | 或 # 带显示名，显示名用于线路列表。
#   只要服务端兼容弹弹play API 就能用，不限于任何一家：
#     /api/v2/match             按文件名自动匹配
#     /api/v2/search/anime      搜索作品与季度
#     /api/v2/bangumi/:id      读取所选作品的剧集
#     /api/v2/comment/:id       取弹幕
# 默认不预置第三方线路。添加的线路会收到媒体文件名用于匹配；只添加你信任的线路。
# 想用弹弹play官方线路的话要单独申请 AppId（免费但要审核）；第三方兼容线路无需凭据：
#   api_servers=https://api.dandanplay.net|弹弹play,https://a.example.com|备用
api_servers=

# 只有在用弹弹play官方线路时才需要填（申请地址 doc.dandanplay.com/open/）。
#   填了会自动带 X-AppId / X-Timestamp / X-Signature 三个头。用第三方线路就留空。
dandanplay_app_id=
dandanplay_app_secret=

# ── 自动 ────────────────────────────────────────────────────────────────────
# 自动功能会把当前媒体文件名发送到已配置线路。没有线路时不会联网。
# 设为 no 可关闭自动请求，手动获取仍可用。
# autoload_danmaku：进片时若本地没弹幕，自动按文件名匹配并拉取。静默失败，不打扰。
autoload_danmaku=yes


# ── 请求 ────────────────────────────────────────────────────────────────────
# 公共线路有时要 30 秒才回，所以请求是异步的；这里只控制单次超时上限。
danmaku_timeout=30

# Rendering is owned by DanmakuFactory and mpv's native secondary ASS track.
# The complete upstream options are in %LOCALAPPDATA%/AnimeJaNai-DanmakuFactory.json.
# No Lua frame-rate cap, interpolation clock, or per-frame OSD updates.
enabled=yes
