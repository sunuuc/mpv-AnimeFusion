# Slot switching (including Off = slot 0, a bypass) happens via
# scripts/animejanai_slot.lua, which sends `vf-command aji slot N` to a
# filter that stays in the chain, so no key ever rebuilds the filter
# chain (a rebuild races with commands sent right behind it). The
# apply-profile is a safety net for a manually cleared vf. While paused
# the script also refreshes the shown frame with an exact seek (a
# vf-command alone doesn't re-render a still frame); during playback it
# deliberately doesn't seek - the new slot takes over within a few
# frames, and a seek would flush the audio pipeline (audible dropout).
)                show-text "2x_AnimeJaNai_V3 已关闭"; script-message aji-slot 0
Ctrl+0           show-text "AI 已关闭"; script-message aji-slot 0
!                show-text "2x_AnimeJaNai_V3 画质优先"; script-message aji-slot 1001
@                show-text "2x_AnimeJaNai_V3 均衡"; script-message aji-slot 1002
SHARP            show-text "2x_AnimeJaNai_V3 性能优先"; script-message aji-slot 1003
Ctrl+1   show-text "补帧 2×"; script-message aji-slot 1 #menu: mpv-AnimeFusion > 我的预设 > 1 补帧 2×
Ctrl+2   show-text "2×补帧 + 2K｜极速"; script-message aji-slot 2 #menu: mpv-AnimeFusion > 我的预设 > 2 2×补帧 + 2K｜极速
Ctrl+3   show-text "新配置"; script-message aji-slot 3 #menu: mpv-AnimeFusion > 我的预设 > 3 新配置
Ctrl+4   show-text "新配置"; script-message aji-slot 4 #menu: mpv-AnimeFusion > 我的预设 > 4 新配置
Ctrl+5   show-text "新配置"; script-message aji-slot 5 #menu: mpv-AnimeFusion > 我的预设 > 5 新配置
Ctrl+6   show-text "新配置"; script-message aji-slot 6 #menu: mpv-AnimeFusion > 我的预设 > 6 新配置
