name: Standalone complete portable release
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish the verified complete package
        default: false
permissions:
  contents: write
concurrency:
  group: mpv-animefusion-standalone
  cancel-in-progress: true
jobs:
  full:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - name: Verify and inline player sources
        run: |
          python tools/standalone/verify_player_sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/standalone/inline_player_ui_modules.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_optional_components.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_branding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_publish_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify release-page shortcut is absent
        run: python tests/test_no_release_shortcut.py
      - name: Verify security release checks
        run: python tools/standalone/test_security_verify.py
      - name: Verify release-security policy before building releases
        run: python tools/standalone/security_verify.py preflight
      - name: Test runtime verification
        run: |
          New-Item -ItemType Directory -Force complete-evidence | Out-Null
          python tools/standalone/test_runtime_probe.py 2>&1 | Tee-Object complete-evidence/runtime-verifier-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare UI sources
        run: python tools/standalone/build.py prepare
      - name: Verify Bangumi sync without browser or live account
        run: dotnet run --project tests/bangumi/BangumiChecks.csproj -c Release
      - name: Verify languages and external argument parser
        run: |
          dotnet run --project player/tests/ScopedCommandLine -c Release 2>&1 | Tee-Object language-evidence/parser-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests-generated/manager-tests/ManagerTests.csproj -c Release -- language-evidence 2>&1 | Tee-Object language-evidence/manager-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/manager-profiles/ManagerProfiles.csproj -c Release -- complete-evidence/manager-profiles 2>&1 | Tee-Object language-evidence/manager-profile-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests-generated/player-tests/PlayerTests.csproj -c Release -- language-evidence 2>&1 | Tee-Object language-evidence/player-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile self-contained Windows applications
        run: |
          $releaseVersion = (Get-Content release.json | ConvertFrom-Json).version
          dotnet publish player/src/MpvNet.Windows/MpvNet.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:InformationalVersion=$releaseVersion -o publish-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish manager/AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:InformationalVersion=$releaseVersion -o publish-manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/standalone/Updater.csproj -c Release -o publish-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore pinned build dependencies
        uses: actions/cache/restore@v4
        with:
          path: downloads
          key: standalone-dependencies-${{ hashFiles('tools/standalone/dependencies.json', 'tools/standalone/libass-build-packages.json', 'third_party/danmaku-factory/UPSTREAM.json') }}
      - name: Assemble player core and optional model assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python tools/standalone/build.py stage
      - name: Check antivirus reports and scan release executables
        run: python tools/standalone/security_verify.py scan stage complete-evidence/security
      - name: Save verified build dependencies
        uses: actions/cache/save@v4
        with:
          path: downloads
          key: standalone-dependencies-${{ hashFiles('tools/standalone/dependencies.json', 'tools/standalone/libass-build-packages.json', 'tools/standalone/build_danmaku_factory.py') }}
      - name: Verify optional components and model-free core
        run: python tests/test_optional_components.py stage --updater stage/app/mpv-AnimeFusionUpdater.exe --seven stage/app/7za.exe --model-assets dist
      - name: FPS, external playlist and controller tests
        run: |
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          python tests/test_windows_r2.py stage complete-evidence/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_script_suite.py stage complete-evidence/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Player UI input, layout, track and danmaku tests on Windows
        run: python tests/test_player_ui_windows.py stage complete-evidence/player_ui
      - name: Player UI online danmaku transport tests
        run: python tests/test_danmaku_online.py --mpv stage/app/mpv.exe
      - name: DanmakuFactory package integrity
        run: python tools/standalone/test_danmaku_package.py stage complete-evidence/danmaku
      - name: Local HTTP playback and request-count regressions
        run: python tests/test_network_playback.py stage complete-evidence/network
      - name: External startup, Player UI playlist selection, and deleted-original regression
        run: |
          python tests/test_startup_playback.py stage complete-evidence/startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_player_ui_empty_scope.py stage complete-evidence/player_ui-handoff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and test files extracted into an empty directory
        run: python tools/standalone/build.py package
      - name: Publish and verify public downloads
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python tools/standalone/publish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-validation
          path: |
            complete-evidence/**/*.json
            complete-evidence/**/*.log
            complete-evidence/**/*.png
            language-evidence/*.txt
            language-evidence/*.png
            dist/*.json
            dist/*.txt
            dist/RELEASE.md
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ success() && !inputs.publish }}
        with:
          name: standalone-complete-package
          path: dist/*.7z*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
