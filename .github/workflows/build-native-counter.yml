name: Native frame counter and runtime r2
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: the-database/mpv-winbuild
          ref: 19a2e58e6de47af6711161ed4fc1294a191f40bf
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-database/mpv
          ref: d4c06dd3424dc06d90d4ea15b0fa92fa3ceeb62f
          path: mpv-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: the-database/libass
          ref: 896614fa263f9f64944f7b8650ff6806d5328c4d
          path: libass-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: haasn/libplacebo
          ref: cee9b076f2c63104ccfd497fa79c39a867293ec4
          path: libplacebo-source
          submodules: recursive
          persist-credentials: false
      - name: Apply reviewed patches
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'project/tools/apply_native_r2.py','mpv-source'],check=True)
      - name: Start Windows audio services
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-ffnvcodec-headers
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libunibreak
            mingw-w64-ucrt-x86_64-luajit
            mingw-w64-ucrt-x86_64-mujs
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-xxhash
      - name: Build pinned native components and regression tests
        run: |
          set -euo pipefail
          prefix="$(cygpath -m "$PWD/native-prefix")"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          export PATH="$PWD/native-prefix/bin:$PATH"
          meson setup build-placebo libplacebo-source --prefix="$prefix" --buildtype=release --default-library=shared --wrap-mode=nodownload -Ddemos=false -Dtests=false -Dbench=false -Dfuzz=false -Dvulkan=enabled -Dd3d11=enabled -Dopengl=enabled -Dshaderc=enabled -Dxxhash=enabled
          meson compile -C build-placebo -j 4
          meson install -C build-placebo
          meson setup build-ass libass-source --prefix="$prefix" --buildtype=release --default-library=shared --wrap-mode=nodownload -Ddebug=true -Dthreads=enabled -Ddirectwrite=enabled -Dfontconfig=disabled -Dlibunibreak=enabled -Dtest=disabled -Dcompare=disabled -Dprofile=disabled -Dcheckasm=disabled
          meson compile -C build-ass -j 4
          meson install -C build-ass
          meson setup build-mpv mpv-source --prefix="$prefix" --buildtype=release --wrap-mode=nodownload -Dlibmpv=true -Dcplayer=true -Dtests=true -Ddebug=true -Dcuda-hwaccel=enabled -Dcuda-interop=enabled -Dlua=luajit -Djavascript=enabled -Dd3d11=enabled -Dvulkan=enabled -Dmanpage-build=disabled -Dhtml-build=disabled -Dpdf-build=disabled
          meson compile -C build-mpv -j 4
          meson install -C build-mpv
          python test-build/stage-native.py "$prefix" "$(cygpath -m /ucrt64)" native-output
          python test-build/prepare-test-runtime.py
          meson test -C build-mpv --print-errorlogs
          (cd mpv-source && python TOOLS/subtest/test_stability.py --cc gcc --out ../native-output/build-info/subtitle-stability)
          pacman -Q > native-output/build-info/msys2-packages.txt
          git -C mpv-source -c core.autocrlf=true diff --binary > native-output/build-info/native-r2.patch
          git -C mpv-source rev-parse HEAD > native-output/build-info/mpv-commit.txt
          git -C libass-source rev-parse HEAD > native-output/build-info/libass-commit.txt
          git -C libplacebo-source rev-parse HEAD > native-output/build-info/libplacebo-commit.txt
          cp mpv-source/Copyright native-output/build-info/mpv-Copyright.txt
      - name: Test native FPS, repeated shutdown and short-lived client thread
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'project/tests/test_native_runtime.py','native-output','native-output/build-info/runtime-tests'],check=True,timeout=240)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-r2-candidate
          path: native-output/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-r2-build-failure
          path: |
            build-ass/meson-logs/
            build-mpv/meson-logs/
            native-output/build-info/
          retention-days: 7
